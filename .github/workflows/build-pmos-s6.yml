name: Construir imagenes de postmarketOS

on:
  push:
    branches:
      - "claude/postmarketos-galaxy-s6-img-y9u65z"
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: "Samsung Galaxy S6 (SM-G920F)"
            device: "samsung-zeroflte"
            patrones: "^samsung-zeroflte$ ^samsung-zeroflte ^samsung-zero"
            ui: "phosh"
            hostname: "galaxys6"
          - nombre: "Samsung Galaxy J5 2017 (SM-J530F/DS)"
            device: "samsung-j5y17lte"
            patrones: "^samsung-j5y17lte$ ^samsung-j5y17 ^samsung-j5.*17"
            ui: "phosh"
            hostname: "galaxyj5"
          # El Xiaomi Redmi 9A / 9AT (dandelion) NO tiene puerto en postmarketOS:
          # no aparece en pmaports, asi que no se puede construir una imagen.

    name: ${{ matrix.nombre }}

    env:
      PMOS_DEVICE: ${{ matrix.device }}
      PMOS_PATRONES: ${{ matrix.patrones }}
      PMOS_UI: ${{ matrix.ui }}
      PMOS_HOSTNAME: ${{ matrix.hostname }}
      PMOS_USER: usuario
      PMOS_PASSWORD: "147147"
      ENTERS: /tmp/enters.txt

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          set -x
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git openssl procps util-linux coreutils xz-utils zstd \
            python3 python3-venv

      - name: Preparar binfmt_misc (emulacion de otras arquitecturas)
        run: |
          set -x
          if [ ! -e /proc/sys/fs/binfmt_misc/register ]; then
            sudo modprobe binfmt_misc || true
            sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc || true
          fi
          ls -la /proc/sys/fs/binfmt_misc || true

      - name: Instalar pmbootstrap
        run: |
          set -euxo pipefail
          # pmbootstrap ya no se publica en PyPI: se instala desde su git oficial
          SRC="$HOME/pmbootstrap-src"
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$SRC" \
            || git clone --depth=1 https://github.com/postmarketOS/pmbootstrap.git "$SRC"
          git -C "$SRC" log --oneline -1

          python3 -m venv "$HOME/pmb-venv"
          "$HOME/pmb-venv/bin/python" -m pip install --upgrade pip setuptools wheel

          if "$HOME/pmb-venv/bin/python" -m pip install "$SRC"; then
            echo "$HOME/pmb-venv/bin" >> "$GITHUB_PATH"
          else
            echo "pip install fallo; se usa el script pmbootstrap.py directamente"
            mkdir -p "$HOME/bin"
            printf '#!/bin/sh\nexec %s/pmbootstrap.py "$@"\n' "$SRC" > "$HOME/bin/pmbootstrap"
            chmod +x "$HOME/bin/pmbootstrap"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Preparar respuestas automaticas
        run: |
          set -euxo pipefail
          pmbootstrap --version
          df -h /
          # pmbootstrap init es interactivo. En vez de canalizar 'yes' (que muere
          # con SIGPIPE y hace fallar el paso), le damos un fichero con muchas
          # lineas vacias: cada una equivale a pulsar ENTER y aceptar el defecto.
          python3 -c "open('$ENTERS','w').write('\n'*2000)"

      - name: Primera inicializacion (crea la configuracion y clona pmaports)
        run: |
          set +e
          set -x
          pmbootstrap config jobs "$(nproc)"
          pmbootstrap --details-to-stdout init < "$ENTERS"
          echo "codigo de salida de init: $?"
          pmbootstrap config
          exit 0

      - name: Detectar el nombre del dispositivo en postmarketOS
        run: |
          set -euxo pipefail
          APORTS="$(pmbootstrap config aports 2>/dev/null | tr -d '[:space:]' || true)"
          if [ ! -d "$APORTS" ]; then
            APORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          fi
          echo "pmaports en: $APORTS"
          git -C "$APORTS" log --oneline -1 || true

          VENDOR="${PMOS_DEVICE%%-*}"
          echo "=== dispositivos de $VENDOR disponibles ==="
          find "$APORTS/device" -maxdepth 2 -type d -name "device-$VENDOR-*" -printf '%f\n' \
            | sed 's/^device-//' | sort | tee /tmp/candidatos.txt
          wc -l /tmp/candidatos.txt

          DEV=""
          for pat in $PMOS_PATRONES; do
            if grep -qE "$pat" /tmp/candidatos.txt; then
              DEV="$(grep -E "$pat" /tmp/candidatos.txt | head -1)"
              echo "coincidencia con el patron '$pat': $DEV"
              break
            fi
          done

          if [ -z "$DEV" ]; then
            echo "ERROR: no hay ningun puerto para $PMOS_DEVICE en esta version de pmaports."
            echo "La lista completa de dispositivos de $VENDOR esta arriba."
            exit 1
          fi
          echo "dispositivo elegido: $DEV"
          echo "PMOS_DEVICE=$DEV" >> "$GITHUB_ENV"

          echo "=== paquetes de firmware disponibles para $DEV ==="
          ls "$APORTS/firmware" 2>/dev/null | grep -F "${DEV#*-}" || \
            echo "(ninguno: puede que el firmware privativo no exista para este movil)"

      - name: Seleccionar dispositivo e interfaz grafica
        run: |
          set +e
          set -x
          pmbootstrap config device "$PMOS_DEVICE"
          pmbootstrap config ui "$PMOS_UI"
          pmbootstrap config user "$PMOS_USER"
          pmbootstrap config hostname "$PMOS_HOSTNAME"
          exit 0

      - name: Segunda inicializacion (aplica el dispositivo elegido)
        run: |
          set +e
          set -x
          pmbootstrap --details-to-stdout init < "$ENTERS"
          echo "codigo de salida de init: $?"
          pmbootstrap config
          exit 0

      - name: Comprobar que la configuracion es la correcta
        run: |
          set -euxo pipefail
          DEV="$(pmbootstrap config device | tr -d '[:space:]')"
          GOT_UI="$(pmbootstrap config ui | tr -d '[:space:]')"
          echo "dispositivo configurado: $DEV"
          echo "interfaz configurada: $GOT_UI"
          if [ "$DEV" != "$PMOS_DEVICE" ]; then
            echo "ERROR: se esperaba $PMOS_DEVICE pero la configuracion dice $DEV"
            exit 1
          fi
          if [ "$GOT_UI" != "$PMOS_UI" ]; then
            echo "ERROR: se esperaba la interfaz $PMOS_UI pero hay $GOT_UI"
            exit 1
          fi

      - name: Construir la imagen
        run: |
          set +e
          set -x

          WORK="$(pmbootstrap config work | tr -d '[:space:]')"
          [ -d "$WORK" ] || WORK="$HOME/.local/var/pmbootstrap"
          APORTS="$(pmbootstrap config aports | tr -d '[:space:]')"
          [ -d "$APORTS" ] || APORTS="$WORK/cache_git/pmaports"

          # Cada version de pmbootstrap acepta unos parametros distintos:
          # se miran en la ayuda en vez de adivinarlos.
          EXTRA=""
          AYUDA="$(pmbootstrap install --help 2>&1)"
          echo "$AYUDA" | grep -q -- '--split' && EXTRA="$EXTRA --split"
          echo "$AYUDA" | grep -q -- '--filesystem' && EXTRA="$EXTRA --filesystem ext4"
          echo "parametros elegidos: $EXTRA"

          intentar() {
            # shellcheck disable=SC2086
            pmbootstrap --details-to-stdout install $EXTRA \
              --password "$PMOS_PASSWORD" < "$ENTERS"
          }

          diagnostico() {
            echo "=== ultimas lineas del log de pmbootstrap ==="
            tail -n 30 "$WORK/log.txt" 2>/dev/null \
              || sudo tail -n 30 "$WORK/log.txt" 2>/dev/null \
              || echo "(no se pudo leer el log)"
          }

          ok=0
          intentar && ok=1

          # Varios moviles declaran un paquete de firmware privativo
          # (firmware-samsung-zero, firmware-samsung-j5y17lte...) que no existe
          # en ningun repositorio de postmarketOS, y apk aborta al resolver
          # dependencias. Se quita esa dependencia rota de la receta y se sube
          # pkgrel para que se use la receta parcheada en vez del paquete ya
          # publicado.
          if [ "$ok" -ne 1 ]; then
            diagnostico
            APKBUILD="$(find "$APORTS/device" -maxdepth 3 -path "*device-$PMOS_DEVICE/APKBUILD" | head -1)"
            echo "receta del dispositivo: $APKBUILD"
            if [ -n "$APKBUILD" ]; then
              cp "$APKBUILD" /tmp/APKBUILD.orig
              sed -i -E 's/^([[:space:]]*)depends="firmware-[^"]*"/\1depends=""/' "$APKBUILD"
              sed -i -E 's/^pkgrel=[0-9]+/pkgrel=99/' "$APKBUILD"
              echo "=== cambios en la receta ==="
              diff -u /tmp/APKBUILD.orig "$APKBUILD"
              intentar && ok=1
            fi
          fi

          df -h
          if [ "$ok" -ne 1 ]; then
            diagnostico
            echo "ERROR: no se pudo construir la imagen"
            exit 1
          fi

      - name: Localizar las imagenes generadas
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/salida"
          mkdir -p "$OUT"
          WORK="$(pmbootstrap config work | tr -d '[:space:]')"
          if [ ! -d "$WORK" ]; then
            WORK="$HOME/.local/var/pmbootstrap"
          fi
          echo "directorio de trabajo: $WORK"
          sudo find "$WORK/chroot_native/home/pmos/rootfs" -maxdepth 1 \
            -name "*.img" -print -exec cp -v {} "$OUT"/ \;
          sudo chown -R "$USER":"$USER" "$OUT"
          ls -lh "$OUT"
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "ERROR: no se genero ninguna imagen"
            exit 1
          fi

      - name: Comprimir las imagenes
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/salida"
          cd "$OUT"
          sha256sum *.img > SHA256SUMS.txt
          for f in *.img; do
            xz -T0 -3 -v "$f"
          done
          ls -lh
          # Un fichero de release no puede superar 2 GiB: si se pasa, se parte.
          for f in *.img.xz; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 1900000000 ]; then
              split -b 1900M -d --additional-suffix=".part" "$f" "$f.part-"
              rm -f "$f"
            fi
          done
          ls -lh

      - name: Subir como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-${{ env.PMOS_DEVICE }}-${{ env.PMOS_UI }}
          path: salida/*
          retention-days: 30
          if-no-files-found: error

      - name: Publicar release descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="pmos-${PMOS_DEVICE}-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "postmarketOS ${PMOS_UI} para ${{ matrix.nombre }} (build ${{ github.run_number }})" \
            --notes "Imagenes de postmarketOS generadas automaticamente.

          Movil: ${{ matrix.nombre }}
          Dispositivo en postmarketOS: ${PMOS_DEVICE}
          Interfaz: ${PMOS_UI}
          Usuario: ${PMOS_USER}
          Contrasena: ${PMOS_PASSWORD}

          Descomprime los ficheros .xz antes de flashear.
          Instrucciones completas en el README del repositorio." \
            salida/*
