name: Construir imagen postmarketOS (Samsung Galaxy S6)

on:
  push:
    branches:
      - "claude/postmarketos-galaxy-s6-img-y9u65z"
  workflow_dispatch:
    inputs:
      device:
        description: "Codename del dispositivo en postmarketOS"
        required: false
        default: "samsung-zeroflte"
      ui:
        description: "Interfaz grafica (phosh, plasma-mobile, sxmo-de-sway, console)"
        required: false
        default: "phosh"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    env:
      PMOS_DEVICE: ${{ github.event.inputs.device || 'samsung-zeroflte' }}
      PMOS_UI: ${{ github.event.inputs.ui || 'phosh' }}
      PMOS_USER: usuario
      PMOS_PASSWORD: "147147"
      PMB_WORK: /mnt/pmbootstrap
      ENTERS: /tmp/enters.txt

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          set -x
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Instalar dependencias del sistema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git openssl procps util-linux coreutils xz-utils zstd \
            python3 python3-venv

      - name: Preparar binfmt_misc (emulacion aarch64)
        run: |
          set -x
          if [ ! -e /proc/sys/fs/binfmt_misc/register ]; then
            sudo modprobe binfmt_misc || true
            sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc || true
          fi
          ls -la /proc/sys/fs/binfmt_misc || true

      - name: Instalar pmbootstrap
        run: |
          set -euxo pipefail
          # pmbootstrap ya no se publica en PyPI: se instala desde su git oficial
          SRC="$HOME/pmbootstrap-src"
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$SRC" \
            || git clone --depth=1 https://github.com/postmarketOS/pmbootstrap.git "$SRC"
          git -C "$SRC" log --oneline -1

          python3 -m venv "$HOME/pmb-venv"
          "$HOME/pmb-venv/bin/python" -m pip install --upgrade pip setuptools wheel

          if "$HOME/pmb-venv/bin/python" -m pip install "$SRC"; then
            echo "$HOME/pmb-venv/bin" >> "$GITHUB_PATH"
          else
            echo "pip install fallo; se usa el script pmbootstrap.py directamente"
            mkdir -p "$HOME/bin"
            printf '#!/bin/sh\nexec %s/pmbootstrap.py "$@"\n' "$SRC" > "$HOME/bin/pmbootstrap"
            chmod +x "$HOME/bin/pmbootstrap"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Preparar directorio de trabajo y respuestas automaticas
        run: |
          set -euxo pipefail
          pmbootstrap --version
          sudo mkdir -p "$PMB_WORK"
          sudo chown -R "$USER":"$USER" "$PMB_WORK"
          df -h /mnt /
          # pmbootstrap init es interactivo. En vez de canalizar 'yes' (que muere
          # con SIGPIPE y hace fallar el paso), le damos un fichero con muchas
          # lineas vacias: cada una equivale a pulsar ENTER y aceptar el defecto.
          python3 -c "open('$ENTERS','w').write('\n'*2000)"
          wc -l "$ENTERS"

      - name: Primera inicializacion (crea la configuracion y clona pmaports)
        run: |
          set +e
          set -x
          pmbootstrap config work "$PMB_WORK"
          pmbootstrap config jobs "$(nproc)"
          pmbootstrap --details-to-stdout init < "$ENTERS"
          echo "codigo de salida de init: $?"
          pmbootstrap config
          exit 0

      - name: Seleccionar Galaxy S6 e interfaz grafica
        run: |
          set +e
          set -x
          pmbootstrap config device "$PMOS_DEVICE"
          pmbootstrap config ui "$PMOS_UI"
          pmbootstrap config user "$PMOS_USER"
          pmbootstrap config hostname "galaxys6"
          echo "--- fichero de configuracion ---"
          cat "$HOME/.config/pmbootstrap_v3.cfg" 2>/dev/null \
            || cat "$HOME/.config/pmbootstrap.cfg" 2>/dev/null
          exit 0

      - name: Segunda inicializacion (aplica el dispositivo elegido)
        run: |
          set +e
          set -x
          pmbootstrap --details-to-stdout init < "$ENTERS"
          echo "codigo de salida de init: $?"
          pmbootstrap config
          exit 0

      - name: Comprobar que la configuracion es la correcta
        run: |
          set -euxo pipefail
          DEV="$(pmbootstrap config device | tr -d '[:space:]')"
          GOT_UI="$(pmbootstrap config ui | tr -d '[:space:]')"
          echo "dispositivo configurado: $DEV"
          echo "interfaz configurada: $GOT_UI"
          if [ "$DEV" != "$PMOS_DEVICE" ]; then
            echo "ERROR: se esperaba $PMOS_DEVICE pero la configuracion dice $DEV"
            exit 1
          fi
          if [ "$GOT_UI" != "$PMOS_UI" ]; then
            echo "ERROR: se esperaba la interfaz $PMOS_UI pero hay $GOT_UI"
            exit 1
          fi

      - name: Construir la imagen
        run: |
          set +e
          set -x
          # Distintas versiones aceptan distintos parametros: de mas a menos.
          ok=0
          for extra in "--split --filesystem ext4" "--split" ""; do
            echo ">>> intentando: pmbootstrap install $extra"
            # shellcheck disable=SC2086
            pmbootstrap --details-to-stdout install $extra \
              --password "$PMOS_PASSWORD" < "$ENTERS"
            if [ $? -eq 0 ]; then
              ok=1
              break
            fi
            echo ">>> fallo con: $extra"
          done
          df -h
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: pmbootstrap install fallo con todas las variantes"
            exit 1
          fi

      - name: Localizar las imagenes generadas
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/salida"
          mkdir -p "$OUT"
          sudo find "$PMB_WORK/chroot_native/home/pmos/rootfs" -maxdepth 1 \
            -name "*.img" -print -exec cp -v {} "$OUT"/ \;
          sudo chown -R "$USER":"$USER" "$OUT"
          ls -lh "$OUT"
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "ERROR: no se genero ninguna imagen"
            exit 1
          fi

      - name: Comprimir las imagenes
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/salida"
          cd "$OUT"
          sha256sum *.img > SHA256SUMS.txt
          for f in *.img; do
            xz -T0 -3 -v "$f"
          done
          ls -lh
          # Un fichero de release no puede superar 2 GiB: si se pasa, se parte.
          for f in *.img.xz; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 1900000000 ]; then
              split -b 1900M -d --additional-suffix=".part" "$f" "$f.part-"
              rm -f "$f"
            fi
          done
          ls -lh

      - name: Subir como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-${{ env.PMOS_DEVICE }}-${{ env.PMOS_UI }}
          path: salida/*
          retention-days: 30
          if-no-files-found: error

      - name: Publicar release descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="pmos-${PMOS_DEVICE}-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "postmarketOS ${PMOS_UI} para ${PMOS_DEVICE} (build ${{ github.run_number }})" \
            --notes "Imagenes de postmarketOS generadas automaticamente.

          Dispositivo: ${PMOS_DEVICE}
          Interfaz: ${PMOS_UI}
          Usuario: ${PMOS_USER}
          Contrasena: ${PMOS_PASSWORD}

          Descomprime los ficheros .xz antes de flashear.
          Instrucciones completas en el README del repositorio." \
            salida/*
